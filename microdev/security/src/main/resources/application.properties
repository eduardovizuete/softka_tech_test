spring.application.name=security-service

server.port=9000

eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Enable all Actuator endpoints
management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:mysql://localhost:3306/security_db
spring.datasource.username=root
spring.datasource.password=rootroot

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.jpa.open-in-view=false

info.app.name=Spring Boot security service
info.app.description=Spring Boot security service
info.app.version=0.0.1-SNAPSHOT

# JWT Settings
security.jwt.secret-key=your-256-bit-secret-your-256-bit-secret
security.jwt.issuer=http://localhost:9000
security.jwt.expiration=1200

# Enable debug logging for Spring Security
logging.level.org.springframework.security=DEBUG

# Enable debug logging for Spring Boot Web
logging.level.org.springframework.web=DEBUG
